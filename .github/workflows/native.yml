name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fax:
    name: Fax / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      SPANDSP_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install Windows dependencies
        shell: pwsh
        run: ./scripts/ci/setup-windows.ps1
      - name: Verify static and DLL declarations on both MSVC architectures
        run: python scripts/ci/check-declarations.py
      - name: Build and execute generators, fax tests, and v150 exclusion checks
        run: cargo test --workspace --locked
      - name: Verify packaged native crate
        run: cargo package -p spandsp-sys --locked

  gcc:
    name: Fax / GCC ${{ matrix.optimization }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        optimization: ["-O2", "-O3"]
    env:
      CC: gcc
      CFLAGS: ${{ matrix.optimization }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libclang-dev libtiff-dev libjpeg-dev
      - name: Test optimized native fax and carrier phase training
        run: cargo test --workspace --release --locked
