name: Windows static builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fax:
    name: Fax / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      SPANDSP_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install Windows dependencies
        shell: pwsh
        run: python scripts/ci/run-logged.py pwsh -File scripts/ci/setup-windows.ps1
      - name: Verify static and DLL declarations on both MSVC architectures
        run: python scripts/ci/check-declarations.py
      - name: Build and execute generators, fax tests, and v150 exclusion checks
        run: python scripts/ci/run-logged.py cargo test --workspace --locked
      - name: Verify packaged native crate
        shell: bash
        run: |
          cargo package -p spandsp-sys --locked --no-verify
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "spandsp-sys"))')
          tar -xf "target/package/spandsp-sys-$version.crate" -C "$RUNNER_TEMP"
          cargo test --manifest-path "$RUNNER_TEMP/spandsp-sys-$version/Cargo.toml" --locked
